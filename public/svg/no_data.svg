<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" role="img" aria-labelledby="title desc">
 <title id="title">No data</title><desc id="desc">A teal folder with gently moving papers and a searching magnifying glass.</desc>
 <style>
 .papers{animation:papers 3.4s ease-in-out infinite}
 .search{transform-origin:230px 165px;animation:search 3.4s ease-in-out infinite}
 .dot{animation:pulse 2s ease-in-out infinite}.d2{animation-delay:.5s}.d3{animation-delay:1s}
 @keyframes papers{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
 @keyframes search{0%,100%{transform:translate(0,0) rotate(-5deg)}50%{transform:translate(-9px,-4px) rotate(6deg)}}
 @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
 @media(prefers-reduced-motion:reduce){.papers,.search,.dot{animation:none}}
 </style>
