<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 240 180" role="img" aria-labelledby="title">
  <title id="title">Loading</title>
  <style>
    .orbit { transform-origin:120px 80px; animation:spin 3s linear infinite; }
    .core { transform-origin:120px 80px; animation:breathe 2s ease-in-out infinite; }
    .dot { animation:pulse 1.2s ease-in-out infinite; }
    .b { animation-delay:.16s; } .c { animation-delay:.32s; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes breathe { 0%,100% { transform:scale(.92); opacity:.7; } 50% { transform:scale(1); opacity:1; } }
    @keyframes pulse { 0%,70%,100% { opacity:.25; } 35% { opacity:1; } }
    @media(prefers-reduced-motion:reduce) { .orbit,.core,.dot { animation:none; } }
  </style>
  <circle cx="120" cy="80" r="62" fill="#f0fbf9"/>
  <circle cx="120" cy="80" r="46" fill="none" stroke="#d5f2ee" stroke-width="1.5" stroke-dasharray="3 7"/>
  <g class="core">
    <rect x="96" y="56" width="48" height="48" rx="16" fill="#1a9493"/>
    <path d="M109 80a11 11 0 0 1 19-7" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M131 80a11 11 0 0 1-19 7" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  </g>
  <g class="orbit">
    <circle cx="120" cy="34" r="7" fill="#1a9493"/>
    <rect x="113" y="119" width="14" height="14" rx="4" fill="#88c3c7"/>
  </g>
  <circle class="dot" cx="106" cy="158" r="3" fill="#1a9493"/>
  <circle class="dot b" cx="120" cy="158" r="3" fill="#1a9493"/>
  <circle class="dot c" cx="134" cy="158" r="3" fill="#1a9493"/>
</svg>
