<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 64" width="100%" height="100%">
  <style>
    @keyframes wavingHand {
      0%, 100% {
        transform: rotate(0deg);
      }
      25% {
        transform: rotate(-18deg);
      }
      75% {
        transform: rotate(14deg);
      }
    }
    @keyframes headBob {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-0.8px) rotate(1deg);
      }
    }
    @keyframes sparkleGlow {
      0%, 100% {
        opacity: 0.3;
        transform: scale(0.85);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }
    .waving-arm {
      transform-origin: 43px 42px;
      animation: wavingHand 1.6s ease-in-out infinite;
    }
    .head-group {
      transform-origin: 61px 36px;
      animation: headBob 3.2s ease-in-out infinite;
    }
    .sparkle {
      transform-origin: 15px 17px;
      animation: sparkleGlow 1.6s ease-in-out infinite;
    }
  </style>

  <!-- Shadow / Base -->
  <ellipse cx="51" cy="58" rx="43" ry="4" fill="#e5f8f6"/>

  <!-- Body / Torso -->
  <path d="M43 39Q59 28 74 41L79 56H39Z" fill="#1a9493"/>

  <!-- Neck -->
  <path d="M58 30v9q6 6 10-1V28" fill="#e9ad85"/>

  <!-- Head Group -->
  <g class="head-group">
    <!-- Face -->
    <ellipse cx="61" cy="21" rx="12" ry="15" fill="#f5c5a0"/>
    <!-- Hair -->
    <path d="M49 23Q43 6 57 5Q76 2 74 22L69 16 58 13 51 19Z" fill="#0c2a54"/>
    <!-- Smile -->
    <path d="M59 26q5 5 9-1" fill="none" stroke="#a66150" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="57" cy="21" r="1.2" fill="#0c2a54"/>
    <circle cx="67" cy="21" r="1.2" fill="#0c2a54"/>
  </g>

  <!-- Waving Arm and Hand Group -->
  <g class="waving-arm">
    <!-- Arm -->
    <path d="M43 42L33 30 29 18" fill="none" stroke="#f5c5a0" stroke-width="7" stroke-linecap="round"/>
    <!-- Hand & Fingers -->
    <path d="M29 21l-5-9m5 9-1-12m2 13 3-10" stroke="#f5c5a0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Desk / Surface elements -->
  <path d="M16 35h33l8 23H24Z" fill="#88c3c7"/>
  <circle cx="36" cy="47" r="2.5" fill="white"/>
  <path d="M22 59h39" stroke="#087b7a" stroke-width="2" stroke-linecap="round"/>
  <path d="M82 54q-8-15 3-22 5 13-3 22m1 0q0-12 12-14-1 12-12 14" fill="#b0e4de"/>

  <!-- Sparkle Accents -->
  <g class="sparkle">
    <path d="M15 19l-4-2m8-3-2-4" stroke="#1a9493" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>